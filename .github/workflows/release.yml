name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # Ensure 'universe' is enabled so packages like bpftool are available
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libbpf-dev \
            libcap-dev \
            libelf-dev \
            llvm \
            make \
            pkg-config \
            zlib1g-dev \
            linux-tools-common \
            linux-tools-generic \
            linux-cloud-tools-generic \
            bpftool \
            linux-tools-azure \
            linux-cloud-tools-azure

          # Try to install kernel-specific linux-tools / linux-cloud-tools so bpftool
          # matches the currently running kernel (examples: linux-tools-6.14...-azure).
          KVER="$(uname -r)"
          echo "Detected kernel: ${KVER}"

          # Try to install kernel-specific tooling. The azure kernel packages may
          # live on the Azure mirror — add the azure archive as a fallback source
          # so apt can find linux-tools-<kver>-azure packages used on GitHub runners.
          CODENAME=$(lsb_release -cs)
          sudo tee /etc/apt/sources.list.d/azure.list > /dev/null <<'APT'
deb http://azure.archive.ubuntu.com/ubuntu ${CODENAME} main universe multiverse restricted
deb http://azure.archive.ubuntu.com/ubuntu ${CODENAME}-updates main universe multiverse restricted
deb http://azure.archive.ubuntu.com/ubuntu ${CODENAME}-security main universe multiverse restricted
APT
          sudo apt-get update || true
          if ! sudo apt-get install -y "linux-tools-${KVER}" "linux-cloud-tools-${KVER}" >/dev/null 2>&1; then
            echo "kernel-specific tools not available for ${KVER} from configured repos, continuing with generic packages"
          fi

          # If kernel-specific packages exist in the apt pool we can download the .deb
          # and extract bpftool directly (works around unmet dependency issues).
          set +e
          mkdir -p /tmp/linux-tools-debs
          pushd /tmp/linux-tools-debs >/dev/null
          sudo apt-get download "linux-tools-${KVER}" "linux-cloud-tools-${KVER}" 2>/dev/null || true
          # Also try downloading the azure variants
          sudo apt-get download "linux-tools-${KVER%%-*}-azure" "linux-cloud-tools-${KVER%%-*}-azure" 2>/dev/null || true
          # If any .deb contains bpftool, extract and install it to /usr/local/bin
          for d in ./*.deb; do
            [ -f "$d" ] || continue
            dpkg-deb -x "$d" extracted || continue
            if [ -f extracted/usr/bin/bpftool ]; then
              sudo install -m 0755 extracted/usr/bin/bpftool /usr/local/bin/bpftool
              echo "Installed bpftool from $d"
              break
            fi
            rm -rf extracted
          done
          popd >/dev/null
          set -e

          # Ensure bpftool is available on PATH. Search common install locations and symlink
          if command -v bpftool >/dev/null 2>&1; then
            bpftool version
          else
            BPFT_TOOL="$(find /usr/lib -maxdepth 4 -path '*/linux-tools-*' -name bpftool -print | head -n1)"
            if [ -n "${BPFT_TOOL}" ]; then
              sudo ln -sf "${BPFT_TOOL}" /usr/local/bin/bpftool
              bpftool version
            else
              echo "bpftool not found after installation" >&2
              exit 1
            fi
          fi

      - name: Build bpftool from source (if missing)
        run: |
          set -euo pipefail
          if command -v bpftool >/dev/null 2>&1; then
            echo "bpftool already installed"
            bpftool version
          else
            sudo apt-get update
            sudo apt-get install -y git libssl-dev libelf-dev libelf1 || true
            rm -rf /tmp/bpftool
            git clone --depth 1 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
            cd /tmp/bpftool/src
            make -j$(nproc)
            sudo install -m 0755 bpftool /usr/local/bin/bpftool
            /usr/local/bin/bpftool version
          fi

      - name: Build binaries with Makefile
        run: |
          make clean
          make all

      - name: Generate release notes
        id: release_notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const tagName = context.ref.replace('refs/tags/', '');
            const response = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: tagName,
              target_commitish: context.sha
            });

            let body = response.data.body || '';
            const previousTag = response.data.previous_tag_name;

            if (previousTag) {
              const compare = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${previousTag}...${tagName}`
              });

              if (compare.data.commits?.length) {
                body += `\n\n## Changes`;
                for (const commit of compare.data.commits) {
                  const subject = commit.commit.message.split('\n')[0];
                  const sha = commit.sha.substring(0, 7);
                  body += `\n- ${subject} (${sha})`;
                }
              }
            }

            if (!body.trim()) {
              body = `Release ${tagName}`;
            }

            return { body };

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syscall-monitor-build
          path: |
            syscall_monitor
            syscall_monitoring.bpf.o

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            syscall_monitor
            syscall_monitoring.bpf.o
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
